# Co-op local stack (podman-compose / docker-compose compatible).
#
# Production deploys against a hosted Supabase/Postgres database via the
# DATABASE_URL environment variable. This file provides a local Postgres for
# development; it does NOT run MySQL (Task 11 / audit H3).
version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://coop:coop_password@db:5432/coop
      - COOP_ENV=development
      - CLERK_FRONTEND_API=${CLERK_FRONTEND_API:-}
      - CLERK_ALLOWED_ORIGINS=${CLERK_ALLOWED_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=coop
      - POSTGRES_PASSWORD=coop_password
      - POSTGRES_DB=coop
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
