# Podman Compose file (compatible with docker-compose syntax)
# This file mirrors docker-compose.yml for use with podman-compose.
version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=erp_business_db
      - MYSQL_USER=erp
      - MYSQL_PASSWORD=erp_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always

volumes:
  db_data:
