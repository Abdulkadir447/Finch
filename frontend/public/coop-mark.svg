<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Co-op mark">
  <!--
    Co-op mark — "two partners, one spark".
    Two overlapping rounded squares (cooperation) with a shared overlap
    (the deeper tint) and a four-point spark at the center (intelligence).
    Uses the Co-op design-system purple family; reads cleanly at 16px+.
  -->
  <defs>
    <linearGradient id="coopA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5fef"/>
      <stop offset="1" stop-color="#4143d5"/>
    </linearGradient>
    <linearGradient id="coopB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4cfc"/>
      <stop offset="1" stop-color="#712ae2"/>
    </linearGradient>
    <linearGradient id="coopO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#474adb"/>
      <stop offset="1" stop-color="#4143d5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="9" width="27" height="27" rx="9" fill="url(#coopA)"/>
  <rect x="17" y="12" width="27" height="27" rx="9" fill="url(#coopB)"/>
  <rect x="17" y="12" width="14" height="24" rx="8" fill="url(#coopO)"/>
  <path d="M24 15 Q25.2 21.2 31 24 Q25.2 26.8 24 33 Q22.8 26.8 17 24 Q22.8 21.2 24 15 Z" fill="#ffffff"/>
</svg>
